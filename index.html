<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life RPG</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

        transform: rotate(360deg);
      }
    }

        opacity: 0;
        transform: translateY(16px);

        opacity: 1;

<body>
  <div id="root"></div>
  <script type="text/babel">
    // ═══════════════════════════════════════════════════════════════
    //  ⚙️  CONFIGURATION SUPABASE
    // ═══════════════════════════════════════════════════════════════
    const SUPABASE_URL = "https://arsmnelxpsmzzyxlevky.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_V8eX4Snubbi3e0WUKP74Gw_M-D1z4QM";
    // ═══════════════════════════════════════════════════════════════

    const { useState, useEffect, useRef, useCallback } = React;
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ── DB ──────────────────────────────────────────────────────────
    async function dbLoad(userId) {
      const { data, error } = await sb.from("life_rpg_saves").select("data").eq("user_id", userId).maybeSingle();
      if (error) { console.error(error); return null; }
      return data ? data.data : null;
    }
    async function dbSave(userId, gameData) {
      const { error } = await sb.from("life_rpg_saves")
        .upsert({ user_id: userId, data: gameData, updated_at: new Date().toISOString() }, { onConflict: "user_id" });
      if (error) console.error(error);
    }

    // ── CONSTANTES ──────────────────────────────────────────────────
    const CLASSES = [
      { id: "warrior", label: "⚔️ Guerrier.e", desc: "Force & discipline", bonus: "Physique" },
      { id: "mage", label: "🧙 Mage", desc: "Savoir & créativité", bonus: "Savoir" },
      { id: "rogue", label: "🗡️ Roublard.e", desc: "Agilité & productivité", bonus: "Carrière" },
      { id: "paladin", label: "🛡️ Paladin.e", desc: "Équilibre & bien-être", bonus: "Vitalité" },
      { id: "bard", label: "🎶 Barde", desc: "Social & inspiration", bonus: "Social" },
    ];
    const CATEGORIES = ["Physique", "Vitalité", "Carrière", "Savoir", "Social", "Aventure"];
    const CAT_COLORS = {
      Physique: "#e05252", Vitalité: "#52b0e0", Carrière: "#e0a852",
      Savoir: "#9b59e0", Social: "#52e08a", Aventure: "#e07852",
    };

    // ── XP / LEVEL ──────────────────────────────────────────────────
    const xpForLevel = l => Math.floor(100 * Math.pow(1.4, l - 1));
    const totalXpForLvl = l => { let t = 0; for (let i = 1; i < l; i++) t += xpForLevel(i); return t; };
    const computeLevel = xp => { let l = 1; while (xp >= totalXpForLvl(l + 1)) l++; return l; };
    const TODAY = () => new Date().toISOString().slice(0, 10);
    const fmt = d => new Date(d + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" });
    const fmtShort = d => new Date(d + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "short" });

    // ── STREAK (aujourd'hui en cours ne casse pas la série) ─────────
    function calcStreak(logs) {
      if (!logs.length) return 0;
      const sorted = [...logs].sort((a, b) => b.date.localeCompare(a.date));
      const todayStr = TODAY();
      const todayLog = sorted.find(l => l.date === todayStr);

      // Si aujourd'hui n'a rien de fait, on commence le calcul à hier
      let d = new Date();
      if (!todayLog || todayLog.done.length === 0) {
        d.setDate(d.getDate() - 1);
      }

      let streak = 0;
      for (let i = 0; i < sorted.length; i++) {
        const check = d.toISOString().slice(0, 10);
        if (check === todayStr && (!todayLog || todayLog.done.length === 0)) continue; // skip aujourd'hui si vide
        if (sorted[i].date === check) {
          if (sorted[i].done.length > 0) { streak++; d.setDate(d.getDate() - 1); }
          else break;
        } else if (sorted[i].date < check) {
          break;
        }
      }
      return streak;
    }

    // ── HELPERS SEMAINE ─────────────────────────────────────────────
    // Retourne le lundi de la semaine contenant dateStr
    function getWeekStart(dateStr) {
      const d = new Date(dateStr + "T12:00:00");
      const day = d.getDay(); // 0=dim, 1=lun...
      const diff = day === 0 ? -6 : 1 - day;
      d.setDate(d.getDate() + diff);
      return d.toISOString().slice(0, 10);
    }
    function getWeekEnd(dateStr) {
      const d = new Date(getWeekStart(dateStr) + "T12:00:00");
      d.setDate(d.getDate() + 6);
      return d.toISOString().slice(0, 10);
    }
    // IDs des tâches hebdo faites au moins une fois dans la semaine de dateStr
    function getWeeklyDoneThisWeek(logs, dateStr, actions) {
      const ws = getWeekStart(dateStr), we = getWeekEnd(dateStr);
      const done = new Set();
      logs.forEach(l => {
        if (l.date >= ws && l.date <= we)
          (l.done || []).forEach(id => {
            if ((actions || []).find(a => a.id === id && a.frequency === "weekly")) done.add(id);
          });
      });
      return done;
    }
    // Calcule le bilan d'une semaine (lundi→dimanche)
    function getWeekSummary(logs, weekStart, actions) {
      const we = getWeekEnd(weekStart);
      const weekLogs = logs.filter(l => l.date >= weekStart && l.date <= we);
      if (!weekLogs.length) return null;

      const dailyActions = (actions || []).filter(a => a.frequency === "daily");
      const weeklyActions = (actions || []).filter(a => a.frequency === "weekly");

      const totalXp = weekLogs.reduce((s, l) => s + (l.xpBreakdown || []).reduce((ss, x) => ss + x.xp, 0), 0);
      const avgXp = Math.round(totalXp / weekLogs.length);

      const avgDaily = weekLogs.length
        ? Math.round(weekLogs.reduce((s, l) => {
          const doneDaily = (l.done || []).filter(id => dailyActions.some(a => a.id === id)).length;
          return s + doneDaily;
        }, 0) / weekLogs.length * 10) / 10
        : 0;

      const weeklyDoneIds = getWeeklyDoneThisWeek(logs, weekStart, actions);
      const weeklyDone = weeklyDoneIds.size;

      return { weekStart, we, daysLogged: weekLogs.length, totalXp, avgXp, avgDaily, weeklyDone, weeklyTotal: weeklyActions.length, dailyTotal: dailyActions.length };
    }

    // ════════════════════════════════════════════════════════════════
    //  ROOT
    // ════════════════════════════════════════════════════════════════
    function App() {
      const [session, setSession] = useState(null);
      const [loading, setLoading] = useState(true);
      const [game, setGame] = useState(null);   // current character
      const [archive, setArchive] = useState([]);      // archived characters
      const [screen, setScreen] = useState(0);
      const [tab, setTab] = useState("dashboard");
      const [toast, setToast] = useState(null);
      const toastRef = useRef(null);

      const showToast = (msg, type = "success") => {
        setToast({ msg, type });
        clearTimeout(toastRef.current);
        toastRef.current = setTimeout(() => setToast(null), 3200);
      };

      const loadAndStart = useCallback(async (userId) => {
        const saved = await dbLoad(userId);
        if (saved) {
          setArchive(saved.archive || []);
          if (saved.current) { setGame(saved.current); setScreen(5); }
          else { setScreen(1); }
        } else {
          setScreen(1);
        }
        setLoading(false);
      }, []);

      useEffect(() => {
        const isCallback = window.location.hash.includes("access_token")
          || window.location.search.includes("code=");
        if (!isCallback) {
          sb.auth.getSession().then(({ data: { session } }) => {
            setSession(session);
            if (session) loadAndStart(session.user.id);
            else setLoading(false);
          });
        }
        const { data: { subscription } } = sb.auth.onAuthStateChange((_e, s) => {
          setSession(s);
          if (s) loadAndStart(s.user.id);
          else if (isCallback) setLoading(false);
        });
        return () => subscription.unsubscribe();
      }, [loadAndStart]);

      // Sauvegarde groupée current + archive
      const persist = useCallback((currentChar, arch) => {
        if (session) dbSave(session.user.id, { current: currentChar, archive: arch });
      }, [session]);

      const updateGame = useCallback((fn) => {
        setGame(prev => {
          const next = fn({ ...prev });
          persist(next, archive);
          return next;
        });
      }, [archive, persist]);

      const logout = async () => {
        await sb.auth.signOut();
        setSession(null); setGame(null); setArchive([]); setScreen(0); setLoading(false);
      };

      // Archiver le personnage actuel + démarrer un nouveau
      const archiveAndNew = (deleteInstead) => {
        const newArchive = deleteInstead ? archive : [...archive, { ...game, archivedAt: TODAY() }];
        setArchive(newArchive);
        setGame(null);
        if (session) dbSave(session.user.id, { current: null, archive: newArchive });
        setScreen(1);
        setTab("dashboard");
      };

      if (loading) return <Splash />;
      if (!session) return <AuthScreen showToast={showToast} toast={toast} />;
      if (screen === 1) return <OnboardName onNext={n => { setGame({ name: n, class: null, xp: 0, goals: [], actions: [], log: [], created: TODAY() }); setScreen(2); }} />;
      if (screen === 2) return <OnboardClass game={game} setGame={setGame} onNext={() => setScreen(3)} />;
      if (screen === 3) return <OnboardGoals game={game} setGame={setGame} onNext={() => setScreen(4)} />;
      if (screen === 4) return <OnboardActions game={game} setGame={setGame} onNext={async () => { persist(game, archive); setScreen(5); }} />;
      return (
        <MainApp
          game={game} updateGame={updateGame}
          archive={archive}
          tab={tab} setTab={setTab}
          showToast={showToast} toast={toast}
          logout={logout} userEmail={session?.user?.email}
          archiveAndNew={archiveAndNew}
        />
      );
    }

    // ════════════════════════════════════════════════════════════════
    //  AUTH SCREEN
    // ════════════════════════════════════════════════════════════════
    function AuthScreen({ showToast, toast }) {
      const [email, setEmail] = useState("");
      const [sent, setSent] = useState(false);
      const [busy, setBusy] = useState(false);
      const [mode, setMode] = useState("choice");

      const handleGoogle = async () => {
        setBusy(true);
        const { error } = await sb.auth.signInWithOAuth({
          provider: "google",
          options: { redirectTo: window.location.origin + window.location.pathname }
        });
        if (error) { showToast("Erreur Google : " + error.message, "error"); setBusy(false); }
      };

      const handleMagic = async () => {
        if (!email.trim()) return;
        setBusy(true);
        const { error } = await sb.auth.signInWithOtp({
          email: email.trim(),
          options: { emailRedirectTo: window.location.origin + window.location.pathname }
        });
        setBusy(false);
        if (error) showToast("Erreur : " + error.message, "error");
        else setSent(true);
      };

      return (
        <div style={S.fullCenter}>
          <div style={{ ...S.card, maxWidth: 400, animation: "fadeUp .5s ease" }}>
            <div style={S.runeRow}>✦ ✦ ✦</div>
            <h1 style={S.goldTitle}>Life RPG</h1>
            <p style={S.muted}>Transforme ta vie en épopée légendaire</p>

            {mode === "choice" && (
              <div style={{ marginTop: 28, display: "flex", flexDirection: "column", gap: 12 }}>
                <button style={{
                  display: "flex", alignItems: "center", justifyContent: "center", gap: 10,
                  background: "#fff", color: "#1a1208", border: "none", borderRadius: 6, padding: "12px 18px",
                  fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: "Cinzel,serif", opacity: busy ? .6 : 1
                }}
                  onClick={handleGoogle} disabled={busy}>
                  <svg width="18" height="18" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.29-8.16 2.29-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                  </svg>
                  Continuer avec Google
                </button>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <div style={{ flex: 1, height: 1, background: "#2a1e06" }} />
                  <span style={{ color: "#444", fontSize: 12 }}>ou</span>
                  <div style={{ flex: 1, height: 1, background: "#2a1e06" }} />
                </div>
                <button style={{ ...S.btnSec, width: "100%", textAlign: "center" }} onClick={() => setMode("email")}>
                  ✉️ Connexion par lien magique
                </button>
                <p style={{ color: "#444", fontSize: 11, textAlign: "center" }}>Aucun mot de passe requis.</p>
              </div>
            )}

            {mode === "email" && !sent && (
              <div style={{ marginTop: 28 }}>
                <label style={S.label}>Ton adresse email</label>
                <input style={S.input} type="email" placeholder="heros@aventure.com"
                  value={email} onChange={e => setEmail(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && handleMagic()} autoFocus />
                <button style={{ ...S.btnPrim, width: "100%", marginTop: 12, opacity: busy ? .6 : 1 }} onClick={handleMagic} disabled={busy}>
                  {busy ? "Envoi en cours..." : "✉️ Recevoir mon lien magique"}
                </button>
                <button style={{ ...S.btnSec, width: "100%", marginTop: 10, textAlign: "center" }} onClick={() => setMode("choice")}>← Retour</button>
              </div>
            )}

            {mode === "email" && sent && (
              <div style={{ marginTop: 28, textAlign: "center" }}>
                <div style={{ fontSize: 40, marginBottom: 12 }}>📬</div>
                <p style={{ color: "#c9a84c", fontFamily: "Cinzel,serif", fontSize: 15 }}>Lien magique envoyé !</p>
                <p style={{ color: "#888", fontSize: 13, marginTop: 8, lineHeight: 1.7 }}>
                  Consulte ta boîte mail <strong style={{ color: "#f0dfa0" }}>{email}</strong><br />et clique sur le lien.
                </p>
                <button style={{ ...S.btnSec, marginTop: 20 }} onClick={() => { setSent(false); setMode("choice"); }}>← Retour</button>
              </div>
            )}
          </div>
          {toast && <Toast toast={toast} />}
        </div>
      );
    }

    // ════════════════════════════════════════════════════════════════
    //  ONBOARDING
    // ════════════════════════════════════════════════════════════════
    function OnboardName({ onNext }) {
      const [name, setName] = useState("");
      return (
        <div style={S.fullCenter}>
          <div style={{ ...S.card, animation: "fadeUp .5s ease" }}>
            <div style={S.runeRow}>✦ ✦ ✦</div>
            <h2 style={S.goldTitle}>Ton Personnage</h2>
            <p style={S.muted}>Étape 1 sur 4 — Choisis ton nom</p>
            <div style={{ marginTop: 28 }}>
              <label style={S.label}>Nom de ton personnage</label>
              <input style={S.input} placeholder="Ex: Arthus le Déterminé" value={name}
                onChange={e => setName(e.target.value)} onKeyDown={e => e.key === "Enter" && name.trim() && onNext(name.trim())} autoFocus />
            </div>
            <button style={{ ...S.btnPrim, marginTop: 20, width: "100%", opacity: name.trim() ? 1 : .4 }}
              onClick={() => name.trim() && onNext(name.trim())}>Suivant →</button>
          </div>
        </div>
      );
    }

    function OnboardClass({ game, setGame, onNext }) {
      const [sel, setSel] = useState(null);
      return (
        <div style={S.fullCenter}>
          <div style={{ ...S.card, maxWidth: 520, animation: "fadeUp .5s ease" }}>
            <div style={S.runeRow}>✦ ✦ ✦</div>
            <h2 style={S.goldTitle}>Classe</h2>
            <p style={S.muted}>Étape 2 sur 4 — Bonus XP x1.5 dans ton domaine</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 9, marginTop: 20 }}>
              {CLASSES.map(c => (
                <div key={c.id} style={{ ...S.classRow, ...(sel === c.id ? S.classRowSel : {}) }} onClick={() => setSel(c.id)}>
                  <span style={{ fontSize: 22 }}>{c.label.split(" ")[0]}</span>
                  <div>
                    <div style={{ fontWeight: 700, color: "#f0dfa0", fontSize: 14 }}>{c.label.slice(c.label.indexOf(" ") + 1)}</div>
                    <div style={{ fontSize: 12, color: "#888" }}>{c.desc} · <span style={{ color: "#c9a84c" }}>+50% XP {c.bonus}</span></div>
                  </div>
                  {sel === c.id && <span style={{ marginLeft: "auto", color: "#c9a84c", fontSize: 18 }}>✓</span>}
                </div>
              ))}
            </div>
            <button style={{ ...S.btnPrim, marginTop: 20, width: "100%", opacity: sel ? 1 : .4 }}
              onClick={() => { if (sel) { setGame(g => ({ ...g, class: sel })); onNext(); } }}>Suivant →</button>
          </div>
        </div>
      );
    }

    function OnboardGoals({ game, setGame, onNext }) {
      const [goals, setGoals] = useState([{ title: "", category: "Aventure", xpReward: 500, deadline: "", done: false, id: 1 }]);
      const add = () => setGoals(g => [...g, { title: "", category: "Aventure", xpReward: 500, deadline: "", done: false, id: Date.now() }]);
      const remove = i => setGoals(g => g.filter((_, idx) => idx !== i));
      const upd = (i, k, v) => setGoals(g => g.map((x, idx) => idx === i ? { ...x, [k]: v } : x));
      return (
        <div style={S.fullCenter}>
          <div style={{ ...S.card, maxWidth: 540, animation: "fadeUp .5s ease" }}>
            <div style={S.runeRow}>✦ ✦ ✦</div>
            <h2 style={S.goldTitle}>Quêtes Principales</h2>
            <p style={S.muted}>Étape 3 sur 4 — Tes grands objectifs de vie (3–5 recommandés)</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 12, marginTop: 18, maxHeight: 340, overflowY: "auto", paddingRight: 4 }}>
              {goals.map((g, i) => (
                <div key={g.id} style={S.miniCard}>
                  <div style={{ display: "flex", gap: 8 }}>
                    <input style={{ ...S.input, flex: 1 }} placeholder="Ex: Courir un marathon" value={g.title} onChange={e => upd(i, "title", e.target.value)} />
                    {goals.length > 1 && <button style={S.btnX} onClick={() => remove(i)}>✕</button>}
                  </div>
                  <div style={{ display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
                    <select style={{ ...S.input, flex: 1, minWidth: 110 }} value={g.category} onChange={e => upd(i, "category", e.target.value)}>
                      {CATEGORIES.map(c => <option key={c}>{c}</option>)}
                    </select>
                    <input style={{ ...S.input, width: 130 }} type="date" value={g.deadline} onChange={e => upd(i, "deadline", e.target.value)} />
                    <input style={{ ...S.input, width: 80 }} type="number" min={100} max={5000} step={100} value={g.xpReward} onChange={e => upd(i, "xpReward", +e.target.value)} title="XP" />
                  </div>
                </div>
              ))}
            </div>
            <button style={{ ...S.btnSec, marginTop: 10, width: "100%" }} onClick={add}>+ Ajouter une quête</button>
            <button style={{ ...S.btnPrim, marginTop: 10, width: "100%", opacity: goals.some(g => g.title.trim()) ? 1 : .4 }}
              onClick={() => { const v = goals.filter(g => g.title.trim()); if (!v.length) return; setGame(p => ({ ...p, goals: v })); onNext(); }}>
              Suivant →</button>
          </div>
        </div>
      );
    }

    function OnboardActions({ game, setGame, onNext }) {
      const [actions, setActions] = useState([
        { id: 1, title: "", category: "Physique", xp: 20, frequency: "daily" },
        { id: 2, title: "", category: "Savoir", xp: 15, frequency: "daily" },
      ]);
      const add = () => setActions(a => [...a, { id: Date.now(), title: "", category: "Aventure", xp: 15, frequency: "daily" }]);
      const remove = i => setActions(a => a.filter((_, idx) => idx !== i));
      const upd = (i, k, v) => setActions(a => a.map((x, idx) => idx === i ? { ...x, [k]: v } : x));
      return (
        <div style={S.fullCenter}>
          <div style={{ ...S.card, maxWidth: 540, animation: "fadeUp .5s ease" }}>
            <div style={S.runeRow}>✦ ✦ ✦</div>
            <h2 style={S.goldTitle}>Carte d'Actions</h2>
            <p style={S.muted}>Étape 4 sur 4 — Tes habitudes quotidiennes / hebdomadaires</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 12, marginTop: 18, maxHeight: 340, overflowY: "auto", paddingRight: 4 }}>
              {actions.map((a, i) => (
                <div key={a.id} style={S.miniCard}>
                  <div style={{ display: "flex", gap: 8 }}>
                    <input style={{ ...S.input, flex: 1 }} placeholder="Ex: 30 min de sport" value={a.title} onChange={e => upd(i, "title", e.target.value)} />
                    {actions.length > 1 && <button style={S.btnX} onClick={() => remove(i)}>✕</button>}
                  </div>
                  <div style={{ display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
                    <select style={{ ...S.input, flex: 1, minWidth: 110 }} value={a.category} onChange={e => upd(i, "category", e.target.value)}>
                      {CATEGORIES.map(c => <option key={c}>{c}</option>)}
                    </select>
                    <select style={{ ...S.input, width: 110 }} value={a.frequency} onChange={e => upd(i, "frequency", e.target.value)}>
                      <option value="daily">Quotidien</option>
                      <option value="weekly">Hebdo</option>
                    </select>
                    <input style={{ ...S.input, width: 70 }} type="number" min={5} max={500} value={a.xp} onChange={e => upd(i, "xp", +e.target.value)} title="XP" />
                  </div>
                </div>
              ))}
            </div>
            <button style={{ ...S.btnSec, marginTop: 10, width: "100%" }} onClick={add}>+ Ajouter une action</button>
            <button style={{ ...S.btnPrim, marginTop: 10, width: "100%" }}
              onClick={() => { setGame(p => ({ ...p, actions: actions.filter(a => a.title.trim()) })); onNext(); }}>
              ⚔️ Lancer l'aventure</button>
          </div>
        </div>
      );
    }

    // ════════════════════════════════════════════════════════════════
    //  MAIN APP
    // ════════════════════════════════════════════════════════════════
    function MainApp({ game, updateGame, archive, tab, setTab, showToast, toast, logout, userEmail, archiveAndNew }) {
      const xp = game.xp || 0;
      const level = computeLevel(xp);
      const curXp = totalXpForLvl(level);
      const nextXp = totalXpForLvl(level + 1);
      const pct = ((xp - curXp) / (nextXp - curXp)) * 100;
      const cls = CLASSES.find(c => c.id === game.class) || CLASSES[0];

      return (
        <div style={S.app}>
          <div style={S.header}>
            <div>
              <div style={{ fontFamily: "Cinzel,serif", color: "#c9a84c", fontSize: 17, fontWeight: 700 }}>{game.name}</div>
              <div style={{ fontSize: 11, color: "#888", marginTop: 1 }}>{cls.label} · Niveau {level}</div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ color: "#52b0e0", fontWeight: 700, fontSize: 13 }}>⭐ {xp.toLocaleString()} XP</div>
              <div style={{ marginTop: 5, width: 130 }}>
                <div style={S.barBg}><div style={{ ...S.barFill, width: `${Math.min(100, pct)}%` }} /></div>
                <div style={{ fontSize: 10, color: "#666", marginTop: 2 }}>
                  {(xp - curXp).toLocaleString()} / {(nextXp - curXp).toLocaleString()} → Niv.{level + 1}
                </div>
              </div>
            </div>
            <button style={{ ...S.btnSec, fontSize: 11, padding: "5px 10px" }} onClick={logout} title={userEmail}>↩ Déco</button>
          </div>

          <div style={S.nav}>
            {[{ id: "dashboard", icon: "🗺️", label: "Carte" }, { id: "daily", icon: "📋", label: "Journal" },
            { id: "quests", icon: "🏆", label: "Quêtes" }, { id: "log", icon: "📜", label: "Historique" },
            { id: "profil", icon: "⚙️", label: "Profil" }].map(t => (
              <button key={t.id} style={{ ...S.navBtn, ...(tab === t.id ? S.navActive : {}) }} onClick={() => setTab(t.id)}>
                <span style={{ fontSize: 16 }}>{t.icon}</span>
                <span style={{ fontSize: 10 }}>{t.label}</span>
              </button>
            ))}
          </div>

          <div style={S.content}>
            {tab === "dashboard" && <TabDashboard game={game} level={level} cls={cls} />}
            {tab === "daily" && <TabDaily game={game} updateGame={updateGame} showToast={showToast} />}
            {tab === "quests" && <TabQuests game={game} updateGame={updateGame} showToast={showToast} />}
            {tab === "log" && <TabLog game={game} />}
            {tab === "profil" && <TabProfil game={game} updateGame={updateGame} archive={archive} archiveAndNew={archiveAndNew} showToast={showToast} logout={logout} />}
          </div>

          {toast && <Toast toast={toast} />}
        </div>
      );
    }

    // ════════════════════════════════════════════════════════════════
    //  TAB — DASHBOARD
    // ════════════════════════════════════════════════════════════════
    function TabDashboard({ game, level, cls }) {
      const today = TODAY();
      const todayLog = (game.log || []).find(l => l.date === today);
      const doneToday = todayLog ? todayLog.done : [];
      const streak = calcStreak(game.log || []);

      // Compteur : séparer quotidien et hebdo
      const dailyActions = (game.actions || []).filter(a => a.frequency === "daily");
      const weeklyActions = (game.actions || []).filter(a => a.frequency === "weekly");
      const doneDaily = doneToday.filter(id => dailyActions.some(a => a.id === id)).length;
      // Hebdo : faite n'importe quel jour cette semaine
      const weeklyDoneSet = getWeeklyDoneThisWeek(game.log || [], today, game.actions || []);
      const doneWeekly = weeklyDoneSet.size;

      const catXp = {};
      CATEGORIES.forEach(c => catXp[c] = 0);
      (game.log || []).forEach(l => (l.xpBreakdown || []).forEach(x => { catXp[x.cat] = (catXp[x.cat] || 0) + x.xp; }));
      const maxCatXp = Math.max(...Object.values(catXp), 1);

      return (
        <div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginBottom: 16 }}>
            <StatTile icon="🔥" label="Série" val={`${streak}j`} />
            <StatTile icon="⚔️" label="Niveau" val={level} />
            <StatTile icon="✅" label="Quotidien" val={`${doneDaily}/${dailyActions.length}`}
              sub={weeklyActions.length ? `+ ${doneWeekly}/${weeklyActions.length} hebdo` : null} />
          </div>

          <div style={S.sectionTitle}>🗺️ Carte d'Actions</div>
          {CATEGORIES.map(cat => {
            const catActions = (game.actions || []).filter(a => a.category === cat);
            if (!catActions.length) return null;
            return (
              <div key={cat} style={{ ...S.catBlock, borderLeft: `3px solid ${CAT_COLORS[cat]}`, marginBottom: 10 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                  <span style={{ fontFamily: "Cinzel,serif", color: CAT_COLORS[cat], fontSize: 12, fontWeight: 700 }}>{cat}</span>
                  <span style={{ fontSize: 11, color: "#666" }}>⭐ {(catXp[cat] || 0).toLocaleString()} XP</span>
                </div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                  {catActions.map(a => {
                    const doneThisDay = doneToday.includes(a.id);
                    const doneThisWeek = a.frequency === "weekly" ? weeklyDoneSet.has(a.id) : false;
                    const isDone = a.frequency === "weekly" ? doneThisWeek : doneThisDay;
                    return (
                      <div key={a.id} style={{
                        display: "flex", alignItems: "center", gap: 5, borderRadius: 99, padding: "4px 10px",
                        background: isDone ? CAT_COLORS[cat] + "33" : "#1e1608", border: `1px solid ${isDone ? CAT_COLORS[cat] : "#2a1e06"}`
                      }}>
                        <span style={{ fontSize: 11 }}>{isDone ? "✅" : "⬜"}</span>
                        <span style={{ fontSize: 12, color: "#ddd" }}>{a.title}</span>
                        {a.frequency === "weekly" && <span style={{ fontSize: 9, color: "#888", background: "#2a1e06", borderRadius: 99, padding: "1px 5px" }}>semaine</span>}
                        <span style={{ fontSize: 10, color: "#c9a84c" }}>+{a.xp}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}

          <div style={S.sectionTitle}>📊 XP par Domaine</div>
          {CATEGORIES.map(cat => (
            <div key={cat} style={{ marginBottom: 9 }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 3 }}>
                <span style={{ color: CAT_COLORS[cat] }}>{cat}</span>
                <span style={{ color: "#666" }}>{(catXp[cat] || 0).toLocaleString()} XP</span>
              </div>
              <div style={S.barBg}>
                <div style={{ ...S.barFill, width: `${((catXp[cat] || 0) / maxCatXp) * 100}%`, background: CAT_COLORS[cat] }} />
              </div>
            </div>
          ))}
        </div>
      );
    }

    // ════════════════════════════════════════════════════════════════
    //  TAB — JOURNAL QUOTIDIEN
    // ════════════════════════════════════════════════════════════════
    function TabDaily({ game, updateGame, showToast }) {
      const today = TODAY();
      const existing = (game.log || []).find(l => l.date === today) || { date: today, done: [], xpBreakdown: [], note: "" };
      const [done, setDone] = useState(existing.done || []);
      const [note, setNote] = useState(existing.note || "");
      const [saved, setSaved] = useState(false);

      const toggle = id => { setSaved(false); setDone(d => d.includes(id) ? d.filter(x => x !== id) : [...d, id]); };

      const handleSave = () => {
        const bonusCat = (CLASSES.find(c => c.id === game.class) || CLASSES[0]).bonus;
        const xpBreakdown = [];
        let totalXp = 0;
        done.forEach(id => {
          const a = (game.actions || []).find(x => x.id === id);
          if (!a) return;
          const earned = Math.floor(a.xp * (a.category === bonusCat ? 1.5 : 1));
          xpBreakdown.push({
            id,
            cat: a.category,
            xp: earned,
            title: a.title,
          });
          totalXp += earned;
        });
        const prevXp = (existing.xpBreakdown || []).reduce((s, x) => s + x.xp, 0);
        // Hydrate les anciens logs sans title
        const hydratedLog = (g.log || []).map(entry => ({
          ...entry,
          xpBreakdown: (entry.xpBreakdown || []).map(x => ({
            ...x,
            title: x.title || (game.actions || []).find(a => a.id === x.id)?.title || x.title,
          }))
        }));
        updateGame(g => {
          const hydratedLog = (g.log || []).map(entry => ({
            ...entry,
            xpBreakdown: (entry.xpBreakdown || []).map(x => ({
              ...x,
              title: x.title || (game.actions || []).find(a => a.id === x.id)?.title,
            }))
          }));
          const logs = hydratedLog.filter(l => l.date !== today);
          return { ...g, xp: (g.xp || 0) + totalXp - prevXp, log: [...logs, { date: today, done, xpBreakdown, note }] };
        });
        setSaved(true);
        showToast(`+${totalXp} XP gagnés aujourd'hui ! 🎉`);
      };

      const dailyActions = (game.actions || []).filter(a => a.frequency === "daily");
      const weeklyActions = (game.actions || []).filter(a => a.frequency === "weekly");
      const weeklyDoneSet = getWeeklyDoneThisWeek(game.log || [], today, game.actions || []);

      const renderSection = (actions) => {
        if (!actions.length) return null;
        return (
          <>
            {CATEGORIES.map(cat => {
              const catA = actions.filter(a => a.category === cat);
              if (!catA.length) return null;
              return (
                <div key={cat} style={{ ...S.catBlock, borderLeft: `3px solid ${CAT_COLORS[cat]}`, marginBottom: 8 }}>
                  <div style={{ color: CAT_COLORS[cat], fontFamily: "Cinzel,serif", fontSize: 12, fontWeight: 700, marginBottom: 8 }}>{cat}</div>
                  {catA.map(a => {
                    const isDone = done.includes(a.id);
                    const doneThisWeek = a.frequency === "weekly" && weeklyDoneSet.has(a.id) && !isDone;
                    return (
                      <div key={a.id} style={{
                        display: "flex", alignItems: "center", gap: 12, padding: "9px 6px", borderRadius: 6,
                        cursor: "pointer", marginBottom: 3,
                        background: isDone ? "#1e3320" : doneThisWeek ? "#1a1e10" : "transparent",
                        transition: "background .15s"
                      }}
                        onClick={() => toggle(a.id)}>
                        <div style={{
                          width: 22, height: 22, borderRadius: 4, border: `2px solid ${CAT_COLORS[cat]}`, flexShrink: 0,
                          display: "flex", alignItems: "center", justifyContent: "center",
                          background: isDone ? CAT_COLORS[cat] : "transparent", transition: "all .15s"
                        }}>
                          {isDone && <span style={{ color: "#000", fontSize: 14, lineHeight: 1, fontWeight: 700 }}>✓</span>}
                        </div>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontSize: 14, color: isDone ? "#c9a84c" : "#ddd" }}>{a.title}</div>
                          {doneThisWeek && (
                            <div style={{ fontSize: 10, color: "#52e08a", marginTop: 1 }}>✅ Déjà fait cette semaine</div>
                          )}
                        </div>
                        <div style={{ color: "#c9a84c", fontSize: 12 }}>+{a.xp} XP</div>
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </>
        );
      };

      return (
        <div>
          <div style={S.sectionTitle}>📋 Journal du {fmtShort(today)}</div>
          {!(game.actions || []).length && <p style={S.empty}>Aucune action définie.</p>}

          {dailyActions.length > 0 && (
            <>
              <div style={{ fontSize: 12, color: "#888", marginBottom: 8, fontFamily: "Cinzel,serif" }}>— Quotidien ({done.filter(id => dailyActions.some(a => a.id === id)).length}/{dailyActions.length})</div>
              {renderSection(dailyActions)}
            </>
          )}

          {weeklyActions.length > 0 && (
            <>
              <div style={{ fontSize: 12, color: "#888", margin: "12px 0 8px", fontFamily: "Cinzel,serif" }}>— Hebdomadaire ({done.filter(id => weeklyActions.some(a => a.id === id)).length}/{weeklyActions.length})</div>
              {renderSection(weeklyActions)}
            </>
          )}

          <div style={{ marginTop: 16 }}>
            <label style={S.label}>📝 Note du jour</label>
            <textarea style={{ ...S.input, minHeight: 80, resize: "vertical" }}
              placeholder="Comment s'est passée ta journée ?"
              value={note} onChange={e => { setNote(e.target.value); setSaved(false); }} />
          </div>
          <button style={{ ...S.btnPrim, marginTop: 12, width: "100%" }} onClick={handleSave}>
            {saved ? "✅ Sauvegardé !" : "💾 Enregistrer ma journée"}
          </button>
        </div>
      );
    }

    // ════════════════════════════════════════════════════════════════
    //  TAB — QUÊTES (avec annulation + édition)
    // ════════════════════════════════════════════════════════════════
    function TabQuests({ game, updateGame, showToast }) {
      const [showAdd, setShowAdd] = useState(false);
      const [editId, setEditId] = useState(null);
      const [ng, setNg] = useState({ title: "", category: "Aventure", xpReward: 500, deadline: "" });
      const [editData, setEditData] = useState({});

      const complete = id => {
        updateGame(g => {
          const goal = g.goals.find(x => x.id === id);
          if (!goal || goal.done) return g;
          return { ...g, xp: (g.xp || 0) + goal.xpReward, goals: g.goals.map(x => x.id === id ? { ...x, done: true, completedAt: TODAY() } : x) };
        });
        showToast("Quête accomplie ! 🏆 XP ajoutés !");
      };

      // ← NOUVEAU : annuler une quête accomplie
      const uncomplete = id => {
        updateGame(g => {
          const goal = g.goals.find(x => x.id === id);
          if (!goal || !goal.done) return g;
          return { ...g, xp: Math.max(0, (g.xp || 0) - goal.xpReward), goals: g.goals.map(x => x.id === id ? { ...x, done: false, completedAt: null } : x) };
        });
        showToast("Quête remise en cours. XP retirés.", "error");
      };

      const deleteGoal = id => {
        updateGame(g => ({ ...g, goals: g.goals.filter(x => x.id !== id) }));
        showToast("Quête supprimée.");
      };

      const addGoal = () => {
        if (!ng.title.trim()) return;
        updateGame(g => ({ ...g, goals: [...(g.goals || []), { ...ng, id: Date.now(), done: false }] }));
        setNg({ title: "", category: "Aventure", xpReward: 500, deadline: "" });
        setShowAdd(false);
        showToast("Nouvelle quête ajoutée !");
      };

      const startEdit = g => { setEditId(g.id); setEditData({ title: g.title, category: g.category, xpReward: g.xpReward, deadline: g.deadline || "" }); };
      const saveEdit = () => {
        updateGame(g => ({ ...g, goals: g.goals.map(x => x.id === editId ? { ...x, ...editData } : x) }));
        setEditId(null);
        showToast("Quête modifiée !");
      };

      const active = (game.goals || []).filter(g => !g.done);
      const completed = (game.goals || []).filter(g => g.done);

      return (
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <div style={S.sectionTitle}>🏆 Quêtes Principales</div>
            <button style={{ ...S.btnSec, fontSize: 12 }} onClick={() => setShowAdd(s => !s)}>+ Quête</button>
          </div>

          {showAdd && (
            <div style={{ ...S.miniCard, marginBottom: 14 }}>
              <input style={{ ...S.input, marginBottom: 8 }} placeholder="Titre de la quête" value={ng.title} onChange={e => setNg(g => ({ ...g, title: e.target.value }))} />
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <select style={{ ...S.input, flex: 1, minWidth: 110 }} value={ng.category} onChange={e => setNg(g => ({ ...g, category: e.target.value }))}>
                  {CATEGORIES.map(c => <option key={c}>{c}</option>)}
                </select>
                <input style={{ ...S.input, width: 130 }} type="date" value={ng.deadline} onChange={e => setNg(g => ({ ...g, deadline: e.target.value }))} />
                <input style={{ ...S.input, width: 80 }} type="number" min={100} max={5000} step={100} value={ng.xpReward} onChange={e => setNg(g => ({ ...g, xpReward: +e.target.value }))} />
              </div>
              <button style={{ ...S.btnPrim, marginTop: 8, width: "100%" }} onClick={addGoal}>Ajouter</button>
            </div>
          )}

          {active.map(g => (
            <div key={g.id} style={{ ...S.catBlock, borderLeft: `3px solid ${CAT_COLORS[g.category]}`, marginBottom: 10 }}>
              {editId === g.id ? (
                <div>
                  <input style={{ ...S.input, marginBottom: 8 }} value={editData.title} onChange={e => setEditData(d => ({ ...d, title: e.target.value }))} />
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 8 }}>
                    <select style={{ ...S.input, flex: 1, minWidth: 110 }} value={editData.category} onChange={e => setEditData(d => ({ ...d, category: e.target.value }))}>
                      {CATEGORIES.map(c => <option key={c}>{c}</option>)}
                    </select>
                    <input style={{ ...S.input, width: 130 }} type="date" value={editData.deadline} onChange={e => setEditData(d => ({ ...d, deadline: e.target.value }))} />
                    <input style={{ ...S.input, width: 80 }} type="number" min={100} max={5000} step={100} value={editData.xpReward} onChange={e => setEditData(d => ({ ...d, xpReward: +e.target.value }))} />
                  </div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button style={{ ...S.btnPrim, flex: 1 }} onClick={saveEdit}>✓ Sauvegarder</button>
                    <button style={{ ...S.btnSec }} onClick={() => setEditId(null)}>Annuler</button>
                  </div>
                </div>
              ) : (
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontFamily: "Cinzel,serif", color: "#f0dfa0", fontSize: 14, fontWeight: 700 }}>{g.title}</div>
                    <div style={{ fontSize: 12, color: "#888", marginTop: 4 }}>
                      <span style={{ color: CAT_COLORS[g.category] }}>{g.category}</span>
                      {g.deadline && <span> · ⏳ {fmtShort(g.deadline)}</span>}
                    </div>
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 5, marginLeft: 10, flexShrink: 0 }}>
                    <div style={{ color: "#c9a84c", fontWeight: 700, fontSize: 13 }}>+{g.xpReward} XP</div>
                    <div style={{ display: "flex", gap: 5 }}>
                      <button style={{ ...S.btnSec, fontSize: 11, padding: "4px 8px" }} onClick={() => startEdit(g)}>✏️</button>
                      <button style={{ ...S.btnX, width: "auto", padding: "4px 8px", fontSize: 11, borderRadius: 4 }} onClick={() => deleteGoal(g.id)}>🗑</button>
                      <button style={{ ...S.btnPrim, fontSize: 11, padding: "4px 10px" }} onClick={() => complete(g.id)}>✓ Accomplie</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          ))}

          {!active.length && !completed.length && <p style={S.empty}>Aucune quête. Clique sur "+ Quête".</p>}

          {completed.length > 0 && (
            <>
              <div style={{ ...S.sectionTitle, marginTop: 16, opacity: .6 }}>✅ Accomplies</div>
              {completed.map(g => (
                <div key={g.id} style={{ ...S.catBlock, borderLeft: "3px solid #333", marginBottom: 8 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <div>
                      <div style={{ color: "#888", fontSize: 13, textDecoration: "line-through" }}>{g.title}</div>
                      {g.completedAt && <div style={{ fontSize: 11, color: "#555", marginTop: 2 }}>{fmtShort(g.completedAt)}</div>}
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ color: "#555", fontSize: 12 }}>+{g.xpReward} XP</span>
                      {/* ← NOUVEAU : bouton annuler */}
                      <button
                        style={{
                          background: "#2a1208", color: "#e07852", border: "1px solid #3a2010", borderRadius: 4,
                          fontSize: 11, padding: "4px 8px", cursor: "pointer", fontFamily: "Cinzel,serif"
                        }}
                        onClick={() => uncomplete(g.id)}
                        title="Annuler - retire les XP">
                        ↩ Annuler
                      </button>
                    </div>
                  </div>
                </div>
              ))}
            </>
          )}
        </div>
      );
    }

    // ════════════════════════════════════════════════════════════════
    //  TAB — HISTORIQUE
    // ════════════════════════════════════════════════════════════════
    function TabLog({ game }) {
      const logs = [...(game.log || [])].sort((a, b) => b.date.localeCompare(a.date));
      if (!logs.length) return <p style={S.empty}>Aucune entrée. Remplis ton journal quotidien !</p>;

      // Construire la liste des lundis passés (semaines complètes uniquement)
      const today = TODAY();
      const thisWeekStart = getWeekStart(today);

      // Collecter tous les lundis présents dans les logs (hors semaine en cours)
      const pastWeekStarts = new Set();
      logs.forEach(l => {
        const ws = getWeekStart(l.date);
        if (ws < thisWeekStart) pastWeekStarts.add(ws);
      });

      // Pour chaque log, vérifier si c'est le premier jour affiché d'une nouvelle semaine
      // (i.e. juste avant ce log on change de semaine) → on insère le bilan de la semaine précédente
      const items = []; // {type:"log"|"summary", data}
      let lastWeekStart = null;

      logs.forEach(l => {
        const ws = getWeekStart(l.date);
        // Si on change de semaine et que la semaine précédente est terminée
        if (lastWeekStart && ws !== lastWeekStart && lastWeekStart < thisWeekStart) {
          const summary = getWeekSummary(game.log || [], lastWeekStart, game.actions || []);
          if (summary) items.push({ type: "summary", data: summary });
        }
        items.push({ type: "log", data: l });
        lastWeekStart = ws;
      });
      // Bilan pour la dernière semaine affichée si elle est passée
      if (lastWeekStart && lastWeekStart < thisWeekStart) {
        const summary = getWeekSummary(game.log || [], lastWeekStart, game.actions || []);
        if (summary) items.push({ type: "summary", data: summary });
      }

      return (
        <div>
          <div style={S.sectionTitle}>📜 Chroniques</div>
          {items.map((item, idx) => {
            if (item.type === "summary") {
              const s = item.data;
              const ws = s.weekStart, we = s.we;
              const weekLabel = `Semaine du ${fmtShort(ws)} au ${fmtShort(we)}`;
              return (
                <div key={"sum-" + ws} style={{
                  background: "#0f1a14", border: "1px solid #1e3d28", borderRadius: 10,
                  padding: "14px 16px", marginBottom: 12, marginTop: 4,
                }}>
                  <div style={{ fontFamily: "Cinzel,serif", color: "#52e08a", fontSize: 12, fontWeight: 700, marginBottom: 10 }}>
                    📊 Bilan — {weekLabel}
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                    <div style={S.bilanTile}>
                      <div style={{ fontSize: 18, fontWeight: 700, color: "#f0dfa0" }}>{s.totalXp.toLocaleString()}</div>
                      <div style={{ fontSize: 10, color: "#666", marginTop: 1 }}>XP gagnés</div>
                    </div>
                    <div style={S.bilanTile}>
                      <div style={{ fontSize: 18, fontWeight: 700, color: "#f0dfa0" }}>{s.avgXp}</div>
                      <div style={{ fontSize: 10, color: "#666", marginTop: 1 }}>XP / jour en moyenne</div>
                    </div>
                    <div style={S.bilanTile}>
                      <div style={{ fontSize: 18, fontWeight: 700, color: "#f0dfa0" }}>{s.avgDaily}<span style={{ fontSize: 12, color: "#888" }}>/{s.dailyTotal}</span></div>
                      <div style={{ fontSize: 10, color: "#666", marginTop: 1 }}>tâches quotidiennes / jour</div>
                    </div>
                    {s.weeklyTotal > 0 && (
                      <div style={{ ...S.bilanTile, background: s.weeklyDone === s.weeklyTotal ? "#1a2e1a" : "#1a1208" }}>
                        <div style={{ fontSize: 18, fontWeight: 700, color: s.weeklyDone === s.weeklyTotal ? "#52e08a" : "#e07852" }}>
                          {s.weeklyDone}<span style={{ fontSize: 12, color: "#888" }}>/{s.weeklyTotal}</span>
                        </div>
                        <div style={{ fontSize: 10, color: "#666", marginTop: 1 }}>tâches hebdo faites</div>
                      </div>
                    )}
                  </div>
                  <div style={{ fontSize: 11, color: "#555", marginTop: 8, textAlign: "right" }}>
                    {s.daysLogged} jour{s.daysLogged > 1 ? "s" : ""} enregistré{s.daysLogged > 1 ? "s" : ""}
                  </div>
                </div>
              );
            }

            const l = item.data;
            const dayXp = (l.xpBreakdown || []).reduce((s, x) => s + x.xp, 0);
            const acts = (l.xpBreakdown || []).length
              ? (l.xpBreakdown || []).map(x => ({
                id: x.id,
                title: x.title || (game.actions || []).find(a => a.id === x.id)?.title || "Action supprimée",
                category: x.cat,
              })).filter(x => x.title !== "Action supprimée" || true)
              : (l.done || []).map(id => (game.actions || []).find(a => a.id === id)).filter(Boolean);
            const isMonday = new Date(l.date + "T12:00:00").getDay() === 1;

            return (
              <div key={l.date} style={{ ...S.catBlock, marginBottom: 8, ...(isMonday ? { borderTop: "1px solid #2a1e06" } : {}) }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span style={{ fontFamily: "Cinzel,serif", color: "#c9a84c", fontWeight: 700, fontSize: 13 }}>
                    {isMonday && <span style={{ fontSize: 9, color: "#888", marginRight: 6, verticalAlign: "middle", background: "#2a1e06", padding: "1px 5px", borderRadius: 99 }}>LUN</span>}
                    {fmtShort(l.date)}
                  </span>
                  <span style={{ color: "#52b0e0", fontWeight: 700 }}>+{dayXp} XP</span>
                </div>
                {acts.length > 0 && (
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginTop: 8 }}>
                    {acts.map(a => (
                      <span key={a.id} style={{
                        borderRadius: 99, padding: "3px 10px", fontSize: 11,
                        background: CAT_COLORS[a.category] + "22", border: `1px solid ${CAT_COLORS[a.category]}55`,
                        color: CAT_COLORS[a.category]
                      }}>{a.title}</span>
                    ))}
                  </div>
                )}
                {l.note && <div style={{ fontSize: 12, color: "#888", marginTop: 8, fontStyle: "italic", lineHeight: 1.6 }}>"{l.note}"</div>}
                {!acts.length && !l.note && <div style={{ fontSize: 12, color: "#555", marginTop: 6 }}>Aucune action complétée.</div>}
              </div>
            );
          })}
        </div>
      );
    }

    // ════════════════════════════════════════════════════════════════
    //  TAB — PROFIL (édition + gestion personnage)
    // ════════════════════════════════════════════════════════════════
    function TabProfil({ game, updateGame, archive, archiveAndNew, showToast, logout }) {
      const [section, setSection] = useState(null); // "actions"|"character"|"archive"
      const [confirm, setConfirm] = useState(null); // "reset"|"archive"

      // ── ÉDITION ACTIONS ─────────────────────────────────────────
      const [actions, setActions] = useState(game.actions || []);
      const [actSaved, setActSaved] = useState(false);
      const addAction = () => setActions(a => [...a, { id: Date.now(), title: "", category: "Aventure", xp: 15, frequency: "daily" }]);
      const removeAction = i => setActions(a => a.filter((_, idx) => idx !== i));
      const updAction = (i, k, v) => setActions(a => a.map((x, idx) => idx === i ? { ...x, [k]: v } : x));
      const saveActions = () => {
        updateGame(g => ({ ...g, actions: actions.filter(a => a.title.trim()) }));
        setActSaved(true); setTimeout(() => setActSaved(false), 2000);
        showToast("Actions mises à jour !");
      };

      // ── ÉDITION PERSONNAGE ───────────────────────────────────────
      const [charName, setCharName] = useState(game.name);
      const [charClass, setCharClass] = useState(game.class);
      const saveChar = () => {
        updateGame(g => ({ ...g, name: charName, class: charClass }));
        showToast("Personnage mis à jour !");
      };

      const cls = CLASSES.find(c => c.id === game.class) || CLASSES[0];
      const level = computeLevel(game.xp || 0);
      const daysPlayed = (game.log || []).length;

      return (
        <div>
          <div style={S.sectionTitle}>⚙️ Profil</div>

          {/* RÉSUMÉ */}
          <div style={{ ...S.catBlock, marginBottom: 16, display: "flex", gap: 14, alignItems: "center" }}>
            <div style={{ fontSize: 36 }}>{cls.label.split(" ")[0]}</div>
            <div>
              <div style={{ fontFamily: "Cinzel,serif", color: "#f0dfa0", fontSize: 16, fontWeight: 700 }}>{game.name}</div>
              <div style={{ color: "#888", fontSize: 12, marginTop: 2 }}>{cls.label.slice(cls.label.indexOf(" ") + 1)} · Niv. {level} · {(game.xp || 0).toLocaleString()} XP</div>
              <div style={{ color: "#666", fontSize: 11, marginTop: 2 }}>Créé le {fmt(game.created || TODAY())} · {daysPlayed} jour{daysPlayed > 1 ? "s" : ""} joué{daysPlayed > 1 ? "s" : ""}</div>
            </div>
          </div>

          {/* SECTIONS */}
          {[
            { id: "actions", label: "✏️ Modifier mes actions" },
            { id: "character", label: "🧙 Modifier mon personnage" },
            { id: "archive", label: "📚 Bibliothèque de personnages" },
          ].map(s => (
            <div key={s.id} style={{ marginBottom: 8 }}>
              <button style={{
                ...S.btnSec, width: "100%", textAlign: "left", padding: "12px 14px",
                background: section === s.id ? "#2a1e06" : "transparent"
              }}
                onClick={() => setSection(section === s.id ? null : s.id)}>
                {s.label} {section === s.id ? "▲" : "▼"}
              </button>

              {/* ACTIONS */}
              {section === "actions" && s.id === "actions" && (
                <div style={{ ...S.miniCard, marginTop: 6 }}>
                  <div style={{ display: "flex", flexDirection: "column", gap: 10, maxHeight: 400, overflowY: "auto" }}>
                    {actions.map((a, i) => (
                      <div key={a.id} style={{ background: "#0f0b04", borderRadius: 6, padding: 10 }}>
                        <div style={{ display: "flex", gap: 8 }}>
                          <input style={{ ...S.input, flex: 1 }} value={a.title} onChange={e => updAction(i, "title", e.target.value)} placeholder="Titre" />
                          <button style={S.btnX} onClick={() => removeAction(i)}>✕</button>
                        </div>
                        <div style={{ display: "flex", gap: 8, marginTop: 6, flexWrap: "wrap" }}>
                          <select style={{ ...S.input, flex: 1, minWidth: 100 }} value={a.category} onChange={e => updAction(i, "category", e.target.value)}>
                            {CATEGORIES.map(c => <option key={c}>{c}</option>)}
                          </select>
                          <select style={{ ...S.input, width: 105 }} value={a.frequency} onChange={e => updAction(i, "frequency", e.target.value)}>
                            <option value="daily">Quotidien</option>
                            <option value="weekly">Hebdo</option>
                          </select>
                          <input style={{ ...S.input, width: 65 }} type="number" min={5} max={500} value={a.xp} onChange={e => updAction(i, "xp", +e.target.value)} title="XP" />
                        </div>
                      </div>
                    ))}
                  </div>
                  <button style={{ ...S.btnSec, marginTop: 10, width: "100%" }} onClick={addAction}>+ Ajouter une action</button>
                  <button style={{ ...S.btnPrim, marginTop: 8, width: "100%" }} onClick={saveActions}>
                    {actSaved ? "✅ Sauvegardé !" : "💾 Sauvegarder les actions"}
                  </button>
                </div>
              )}

              {/* PERSONNAGE */}
              {section === "character" && s.id === "character" && (
                <div style={{ ...S.miniCard, marginTop: 6 }}>
                  <label style={S.label}>Nom</label>
                  <input style={{ ...S.input, marginBottom: 12 }} value={charName} onChange={e => setCharName(e.target.value)} />
                  <label style={S.label}>Classe</label>
                  <div style={{ display: "flex", flexDirection: "column", gap: 7, marginBottom: 12 }}>
                    {CLASSES.map(c => (
                      <div key={c.id} style={{ ...S.classRow, ...(charClass === c.id ? S.classRowSel : {}) }} onClick={() => setCharClass(c.id)}>
                        <span style={{ fontSize: 18 }}>{c.label.split(" ")[0]}</span>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontWeight: 700, color: "#f0dfa0", fontSize: 13 }}>{c.label.slice(c.label.indexOf(" ") + 1)}</div>
                          <div style={{ fontSize: 11, color: "#888" }}>+50% XP {c.bonus}</div>
                        </div>
                        {charClass === c.id && <span style={{ color: "#c9a84c" }}>✓</span>}
                      </div>
                    ))}
                  </div>
                  <button style={{ ...S.btnPrim, width: "100%" }} onClick={saveChar}>💾 Sauvegarder</button>

                  {/* Danger zone */}
                  <div style={{ marginTop: 20, padding: "14px", background: "#1a0808", borderRadius: 8, border: "1px solid #3a0a0a" }}>
                    <div style={{ color: "#e05252", fontFamily: "Cinzel,serif", fontSize: 12, fontWeight: 700, marginBottom: 10 }}>⚠️ Zone Dangereuse</div>
                    <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                      <button style={{ ...S.btnSec, flex: 1, borderColor: "#8b2a2a", color: "#e07852", fontSize: 12 }}
                        onClick={() => setConfirm("archive")}>
                        📦 Archiver & nouveau perso
                      </button>
                      <button style={{ ...S.btnSec, flex: 1, borderColor: "#8b2a2a", color: "#e05252", fontSize: 12 }}
                        onClick={() => setConfirm("reset")}>
                        🗑️ Supprimer & nouveau perso
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* BIBLIOTHÈQUE */}
              {section === "archive" && s.id === "archive" && (
                <div style={{ ...S.miniCard, marginTop: 6 }}>
                  {!archive.length && <p style={{ color: "#555", textAlign: "center", padding: "20px 0", fontSize: 13, fontStyle: "italic" }}>Aucun personnage archivé pour l'instant.</p>}
                  {archive.map((c, i) => {
                    const lvl = computeLevel(c.xp || 0);
                    const clsA = CLASSES.find(x => x.id === c.class) || CLASSES[0];
                    return (
                      <div key={i} style={{ background: "#0f0b04", borderRadius: 8, padding: 12, marginBottom: 8, border: "1px solid #2a1e06" }}>
                        <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
                          <div style={{ fontSize: 28 }}>{clsA.label.split(" ")[0]}</div>
                          <div>
                            <div style={{ fontFamily: "Cinzel,serif", color: "#c9a84c", fontWeight: 700 }}>{c.name}</div>
                            <div style={{ fontSize: 12, color: "#888", marginTop: 2 }}>{clsA.label.slice(clsA.label.indexOf(" ") + 1)} · Niv. {lvl} · {(c.xp || 0).toLocaleString()} XP</div>
                            <div style={{ fontSize: 11, color: "#555", marginTop: 1 }}>
                              {c.created && `Créé le ${fmt(c.created)}`}
                              {c.archivedAt && ` · Archivé le ${fmt(c.archivedAt)}`}
                              {` · ${(c.log || []).length} jours`}
                            </div>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          ))}

          {/* MODALE DE CONFIRMATION */}
          {confirm && (
            <div style={{
              position: "fixed", inset: 0, background: "#000000cc", display: "flex", alignItems: "center",
              justifyContent: "center", zIndex: 999, padding: 20
            }}>
              <div style={{ ...S.card, maxWidth: 380, animation: "fadeUp .3s ease" }}>
                <div style={{ fontSize: 32, textAlign: "center", marginBottom: 12 }}>
                  {confirm === "archive" ? "📦" : "🗑️"}
                </div>
                <h3 style={{ fontFamily: "Cinzel,serif", color: "#c9a84c", textAlign: "center", marginBottom: 10 }}>
                  {confirm === "archive" ? "Archiver le personnage ?" : "Supprimer le personnage ?"}
                </h3>
                <p style={{ color: "#888", fontSize: 13, textAlign: "center", lineHeight: 1.7, marginBottom: 20 }}>
                  {confirm === "archive"
                    ? <>Ton personnage <strong style={{ color: "#f0dfa0" }}>{game.name}</strong> sera sauvegardé dans ta bibliothèque et tu pourras créer un nouveau héros.</>
                    : <>Ton personnage <strong style={{ color: "#f0dfa0" }}>{game.name}</strong> et toute sa progression seront <strong style={{ color: "#e05252" }}>définitivement supprimés</strong>.</>
                  }
                </p>
                <div style={{ display: "flex", gap: 10 }}>
                  <button style={{ ...S.btnSec, flex: 1 }} onClick={() => setConfirm(null)}>← Annuler</button>
                  <button style={{ ...S.btnPrim, flex: 1, background: confirm === "reset" ? "linear-gradient(135deg,#7a0f0f,#e05252)" : "linear-gradient(135deg,#7a5c0f,#c9a84c)" }}
                    onClick={() => { setConfirm(null); archiveAndNew(confirm === "reset"); }}>
                    {confirm === "archive" ? "📦 Archiver" : "🗑️ Supprimer"}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ════════════════════════════════════════════════════════════════
    //  SMALL COMPONENTS
    // ════════════════════════════════════════════════════════════════
    function Splash() {
      return (
        <div style={S.fullCenter}>
          <div style={{ fontSize: 48, animation: "spin 1.2s linear infinite" }}>⚔️</div>
          <p style={{ color: "#c9a84c", marginTop: 16, fontFamily: "Cinzel,serif" }}>Chargement…</p>
        </div>
      );
    }

    function StatTile({ icon, label, val, sub }) {
      return (
        <div style={{
          background: "#1a1208", border: "1px solid #2a1e06", borderRadius: 8, padding: "10px 6px",
          textAlign: "center", display: "flex", flexDirection: "column", alignItems: "center", gap: 2
        }}>
          <div style={{ fontSize: 20 }}>{icon}</div>
          <div style={{ fontSize: 19, fontWeight: 700, color: "#f0dfa0", fontFamily: "Cinzel,serif" }}>{val}</div>
          <div style={{ fontSize: 10, color: "#666" }}>{label}</div>
          {sub && <div style={{ fontSize: 9, color: "#555", marginTop: 1 }}>{sub}</div>}
        </div>
      );
    }

    function Toast({ toast }) {
      return (
        <div style={{
          position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)",
          background: toast.type === "success" ? "#1e3d28" : "#4a1515", color: "#f0dfa0",
          padding: "12px 22px", borderRadius: 8, fontFamily: "Cinzel,serif", fontWeight: 700, fontSize: 13,
          zIndex: 9999, boxShadow: "0 4px 24px #000", border: "1px solid #c9a84c44",
          animation: "fadeUp .3s ease", whiteSpace: "nowrap"
        }}>
          {toast.msg}
        </div>
      );
    }

    // ── STYLES ───────────────────────────────────────────────────────
    const S = {
      app: {
        fontFamily: "'Crimson Text',Georgia,serif", background: "#0f0b04", minHeight: "100vh", color: "#ddd",
        display: "flex", flexDirection: "column", maxWidth: 600, margin: "0 auto"
      },
      fullCenter: {
        display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100vh",
        background: "#0f0b04", padding: 16
      },
      card: {
        width: "100%", maxWidth: 440, background: "#140f06", border: "1px solid #3a2a0a",
        borderRadius: 12, padding: 28, boxShadow: "0 0 60px #c9a84c11"
      },
      runeRow: { textAlign: "center", color: "#3a2a0a", letterSpacing: 8, marginBottom: 14, fontSize: 12 },
      goldTitle: { fontFamily: "Cinzel,serif", color: "#c9a84c", fontSize: 26, fontWeight: 700, margin: "0 0 6px", textAlign: "center" },
      muted: { color: "#666", fontSize: 13, textAlign: "center" },
      label: { display: "block", color: "#888", fontSize: 13, marginBottom: 5 },
      input: {
        width: "100%", background: "#1c1608", border: "1px solid #3a2a0a", borderRadius: 6,
        color: "#f0dfa0", padding: "9px 11px", fontSize: 14, fontFamily: "'Crimson Text',serif", outline: "none"
      },
      btnPrim: {
        background: "linear-gradient(135deg,#7a5c0f,#c9a84c)", color: "#0f0b04", border: "none",
        borderRadius: 6, padding: "11px 18px", fontSize: 14, fontWeight: 700, cursor: "pointer",
        fontFamily: "Cinzel,serif", letterSpacing: .5
      },
      btnSec: {
        background: "transparent", color: "#c9a84c", border: "1px solid #3a2a0a", borderRadius: 6,
        padding: "8px 14px", fontSize: 13, cursor: "pointer", fontFamily: "Cinzel,serif"
      },
      btnX: { background: "#3a0a0a", color: "#e05252", border: "none", borderRadius: 4, width: 28, height: 28, cursor: "pointer", flexShrink: 0 },
      classRow: {
        display: "flex", alignItems: "center", gap: 14, background: "#1c1608", border: "1px solid #2a1e06",
        borderRadius: 8, padding: "11px 13px", cursor: "pointer", transition: "all .15s"
      },
      classRowSel: { background: "#2a1e06", border: "1px solid #c9a84c", boxShadow: "0 0 12px #c9a84c22" },
      miniCard: { background: "#1c1608", border: "1px solid #2a1e06", borderRadius: 8, padding: 12 },
      header: {
        background: "#1a1008", borderBottom: "1px solid #2a1e06", padding: "12px 14px",
        display: "flex", justifyContent: "space-between", alignItems: "center", flexShrink: 0, gap: 10
      },
      barBg: { background: "#1e1608", borderRadius: 99, height: 6, overflow: "hidden" },
      barFill: { background: "linear-gradient(90deg,#c9a84c,#f0dfa0)", height: "100%", borderRadius: 99, transition: "width .5s" },
      nav: { display: "flex", background: "#140f06", borderBottom: "1px solid #1e1608", flexShrink: 0 },
      navBtn: {
        flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 1, padding: "8px 2px",
        background: "transparent", border: "none", color: "#666", cursor: "pointer", borderBottom: "2px solid transparent"
      },
      navActive: { color: "#c9a84c", borderBottomColor: "#c9a84c" },
      content: { flex: 1, overflowY: "auto", padding: 14 },
      sectionTitle: { fontFamily: "Cinzel,serif", color: "#c9a84c", fontSize: 13, fontWeight: 700, marginBottom: 10, letterSpacing: .5 },
      catBlock: { background: "#17120a", border: "1px solid #1e1608", borderRadius: 8, padding: 12 },
      empty: { color: "#555", textAlign: "center", padding: "40px 20px", fontStyle: "italic", lineHeight: 1.8, fontSize: 14 },
      bilanTile: { background: "#17120a", border: "1px solid #2a1e06", borderRadius: 8, padding: "10px 12px", textAlign: "center" },
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
